<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
    
  // Configuración de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCQZc42suWda4uAa35C7Z8hgoStFmn9Rrs",
    authDomain: "adrianshop-c50bb.firebaseapp.com",
    projectId: "adrianshop-c50bb",
    storageBucket: "adrianshop-c50bb.firebasestorage.app",
    messagingSenderId: "323803301457",
    appId: "1:323803301457:web:f64a7a1afad3c8b07f9a70"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  const db = getFirestore(app);

  // Teléfono del vendedor y selectores helpers
  const sellerPhone = "525542910238";
  const byId = (id) => document.getElementById(id);
  const money = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", maximumFractionDigits: 0 });

  // Productos por defecto si la base de datos está vacía
  const defaultProducts = [
    { id: 1, name: "Laptop ultraligera 14 pulgadas", category: "Tecnologia", price: 14999, oldPrice: 17999, rating: 4.8, description: "Laptop premium con 16 GB RAM, SSD 512 GB...", badge: "Oferta", image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=85", gallery: [] },
    { id: 2, name: "Audifonos inalambricos premium", category: "Tecnologia", price: 1299, oldPrice: 1899, rating: 4.7, description: "Audifonos con cancelacion de ruido...", badge: "Top ventas", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=85", gallery: [] }
  ];

  // Estado de la aplicación centralizado
  const state = {
    products: [],
    users: {}, // Caché local de usuarios para reseñas
    currentEmail: "",
    category: "Todos",
    query: "",
    cart: [],
    detailProductId: null,
    detailPurchaseId: null
  };

  // --- COMPONENTE: Sincronización con Firebase Firestore ---

  async function saveProductsToCloud() {
    try {
      await setDoc(doc(db, "store", "products"), { items: state.products });
      showToast("Catálogo actualizado en la nube");
    } catch (error) {
      console.error("Error al guardar productos:", error);
      showToast("Error al guardar en la nube");
    }
  }

  async function loadProductsFromCloud() {
    try {
      const snap = await getDoc(doc(db, "store", "products"));
      if (snap.exists()) {
        state.products = snap.data().items || [];
      } else {
        state.products = defaultProducts;
        await saveProductsToCloud(); // Inicializa la BD si está vacía
      }
    } catch (error) {
      console.error("Error al cargar productos:", error);
      state.products = defaultProducts; // Fallback seguro
    }
    renderCategories();
    renderProducts();
    initAdminList();
  }

  async function saveUserToCloud(email, data) {
    if (!email) return;
    try {
      await setDoc(doc(db, "users", email.replace(/\./g, "_")), data);
    } catch (error) {
      console.error("Error al guardar usuario:", error);
    }
  }

  async function loadUserFromCloud(email) {
    if (!email) return null;
    try {
      const snap = await getDoc(doc(db, "users", email.replace(/\./g, "_")));
      if (snap.exists()) {
        return snap.data();
      }
    } catch (error) {
      console.error("Error al cargar usuario:", error);
    }
    return { email, publicName: "Usuario Premium", wallet: 0, purchases: [], reviews: [] };
  }

  // --- LÓGICA DE CONTROLADORES Y RENDER ---

  function currentUser() {
    if (!state.currentEmail) return null;
    return state.users[state.currentEmail] || null;
  }

  function ensureUser() {
    const user = currentUser();
    if (user) return user;
    showToast("Inicia sesión para continuar");
    byId("accountArea").scrollIntoView({ behavior: "smooth", block: "start" });
    return null;
  }

  function showToast(message) {
    byId("toast").textContent = message;
    byId("toast").classList.add("show");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => byId("toast").classList.remove("show"), 1900);
  }

  function productReviews(productId) {
    return Object.values(state.users).flatMap((user) =>
      (user.reviews || []).map((review) => ({ ...review, publicName: user.publicName }))
    ).filter((review) => review.productId === productId);
  }

  function filteredProducts() {
    return state.products.filter((product) => {
      const matchesCategory = state.category === "Todos" || product.category === state.category;
      const text = `${product.name} ${product.category} ${product.description}`.toLowerCase();
      return matchesCategory && text.includes(state.query.toLowerCase());
    });
  }

  function renderCategories() {
    const categories = ["Todos", ...new Set(state.products.map((product) => product.category))];
    byId("categories").innerHTML = categories.map((category) => `
      <button class="chip ${state.category === category ? "active" : ""}" type="button" data-category="${category}">${category}</button>
    `).join("");
  }

  function renderProducts() {
    const items = filteredProducts();
    byId("productGrid").innerHTML = items.length ? items.map((product) => `
      <article class="product-card" data-open-product="${product.id}">
        <div class="product-image">
          ${product.badge ? `<span class="badge">${product.badge}</span>` : ""}
          <img src="${product.image}" alt="${product.name}" />
        </div>
        <div class="product-info">
          <div class="rating">★ ${product.rating}</div>
          <strong class="product-title">${product.name}</strong>
          <div class="price-row">
            <span class="price">${money.format(product.price)}</span>
            ${product.oldPrice ? `<span class="old-price">${money.format(product.oldPrice)}</span>` : ""}
          </div>
          <span class="shipping">Entrega Personal</span>
          <button class="add" type="button" data-add-cart="${product.id}">Agregar al pedido</button>
        </div>
      </article>
    `).join("") : `<div class="empty">No se encontraron productos premium.</div>`;
  }

  function updateInterface() {
    const user = currentUser();
    if (user) {
      byId("accountStatus").textContent = "Sesión activa";
      byId("email").value = user.email;
      byId("email").disabled = true;
      byId("publicName").value = user.publicName;
      byId("walletTop").textContent = money.format(user.wallet);
      byId("walletBalance").textContent = `${money.format(user.wallet)} MXN disponibles`;
      byId("purchaseCount").textContent = user.purchases.length;
      renderPurchases(user);
    } else {
      byId("accountStatus").textContent = "Sin sesión";
      byId("email").value = "";
      byId("email").disabled = false;
      byId("publicName").value = "";
      byId("walletTop").textContent = "$0";
      byId("walletBalance").textContent = "$0 MXN disponibles";
      byId("purchaseCount").textContent = "0";
      byId("purchaseList").innerHTML = `<div class="empty">Inicia sesión para ver tus compras.</div>`;
    }
    renderCart();
  }

  function renderPurchases(user) {
    const list = user.purchases || [];
    byId("purchaseList").innerHTML = list.length ? list.map((p) => {
      const prod = state.products.find(x => x.id === p.productId);
      if (!prod) return "";
      const yaRevisado = user.reviews.some(r => r.purchaseId === p.purchaseId);
      return `
        <div class="purchase-item">
          <img src="${prod.image}" alt="${prod.name}">
          <div>
            <strong>${prod.name}</strong>
            <span class="small">F. Compra: ${p.date}</span>
          </div>
          <div class="actions">
            ${yaRevisado 
              ? `<span class="shipping">Reseña enviada (+$10)</span>` 
              : `<button class="primary" type="button" data-review-prod="${prod.id}" data-review-pur="${p.purchaseId}">Dejar Reseña</button>`
            }
          </div>
        </div>
      `;
    }).join("") : `<div class="empty">Aún no tienes compras registradas.</div>`;
  }

  function renderCart() {
    byId("cartCount").textContent = state.cart.length;
    if (!state.cart.length) {
      byId("orderStatus").textContent = "Sin productos";
      byId("orderList").innerHTML = `<div class="empty">El carrito está vacío. Agrega productos premium de nuestro catálogo.</div>`;
      byId("subtotal").textContent = "$0";
      byId("total").textContent = "$0";
      return;
    }
    byId("orderStatus").textContent = `${state.cart.length} artículo(s)`;
    let subtotal = 0;
    byId("orderList").innerHTML = state.cart.map((item, index) => {
      subtotal += item.price;
      return `
        <div class="order-item">
          <img src="${item.image}" alt="${item.name}">
          <div>
            <div class="order-name">${item.name}</div>
            <div class="order-price">${money.format(item.price)}</div>
          </div>
          <button class="remove" type="button" data-remove-index="${index}">×</button>
        </div>
      `;
    }).join("");
    byId("subtotal").textContent = money.format(subtotal);
    byId("total").textContent = money.format(subtotal);
  }

  // --- DETALLE DE PRODUCTO Y MODAL ---
  function openProductModal(id, preferredPurchaseId = null) {
    const product = state.products.find(p => p.id === parseInt(id));
    if (!product) return;
    state.detailProductId = product.id;
    state.detailPurchaseId = preferredPurchaseId;

    byId("detailTitle").textContent = product.name;
    byId("detailSubtitle").textContent = product.category;
    byId("detailMainImage").src = product.image;
    byId("detailPrice").textContent = money.format(product.price);
    byId("detailOldPrice").textContent = product.oldPrice ? money.format(product.oldPrice) : "";
    byId("detailDescription").textContent = product.description;
    byId("detailRating").textContent = `★ ${product.rating}`;

    // Render Miniaturas
    const gallery = [product.image, ...(product.gallery || [])];
    byId("detailThumbs").innerHTML = gallery.map((img, i) => `
      <img src="${img}" class="${i === 0 ? "active" : ""}" data-thumb-src="${img}" alt="Miniatura">
    `).join("");

    // Habilitar sección de reseñas si tiene compra disponible
    const user = currentUser();
    const yaRevisado = user ? user.reviews.some(r => r.purchaseId === preferredPurchaseId) : false;
    
    if (user && preferredPurchaseId && !yaRevisado) {
      byId("detailReviewForm").style.display = "grid";
      byId("reviewHint").style.display = "none";
    } else {
      byId("detailReviewForm").style.display = "none";
      byId("reviewHint").style.display = "block";
      byId("reviewHint").textContent = yaRevisado ? "Ya has calificado esta compra." : "Esta opción se habilita automáticamente al comprar el producto.";
    }

    // Cargar Reseñas del producto
    const reviews = productReviews(product.id);
    byId("detailReviews").innerHTML = reviews.length ? reviews.map(r => `
      <div class="review-item">
        ${r.photo ? `<img src="${r.photo}" class="review-photo" alt="Foto de cliente">` : ""}
        <div>
          <strong>${r.publicName} <span class="shipping">✓ Comprador</span></strong>
          <p class="small">${r.text}</p>
        </div>
      </div>
    `).join("") : `<div class="empty">Aún no hay reseñas con foto para este producto. ¡Sé el primero!</div>`;

    byId("productModal").classList.add("open");
  }

  // --- PANEL ADMINISTRADOR (PROPIETARIO) ---
  function initAdminList() {
    byId("adminList").innerHTML = state.products.map(p => `
      <div class="admin-product">
        <img src="${p.image}" alt="${p.name}">
        <div>
          <strong>${p.name}</strong>
          <span class="small">${money.format(p.price)} · ${p.category}</span>
        </div>
        <div class="actions">
          <button class="ghost-button" type="button" data-edit-admin="${p.id}">Editar</button>
          <button class="danger-button" type="button" data-delete-admin="${p.id}">Quitar</button>
        </div>
      </div>
    `).join("");
  }

  // --- MANEJO DE EVENTOS (LISTENERS GLOBALES) ---

  window.addEventListener("click", async (e) => {
    // Categorías
    if (e.target.classList.contains("chip")) {
      state.category = e.target.dataset.category;
      renderCategories();
      renderProducts();
    }
    // Agregar al carrito
    if (e.target.hasAttribute("data-add-cart")) {
      const prod = state.products.find(p => p.id === parseInt(e.target.getAttribute("data-add-cart")));
      if (prod) {
        state.cart.push(prod);
        renderCart();
        showToast("Producto agregado al pedido");
      }
    }
    // Quitar del carrito
    if (e.target.classList.contains("remove")) {
      const idx = parseInt(e.target.getAttribute("data-remove-index"));
      state.cart.splice(idx, 1);
      renderCart();
    }
    // Abrir detalle de producto
    const card = e.target.closest("[data-open-product]");
    if (card && !e.target.hasAttribute("data-add-cart")) {
      openProductModal(card.dataset.openProduct);
    }
    // Miniaturas de galería
    if (e.target.hasAttribute("data-thumb-src")) {
      document.querySelectorAll(".thumbs img").forEach(img => img.classList.remove("active"));
      e.target.classList.add("active");
      byId("detailMainImage").src = e.target.dataset.thumbSrc;
    }
    // Botón de reseña en Mis Compras
    if (e.target.hasAttribute("data-review-prod")) {
      openProductModal(e.target.getAttribute("data-review-prod"), e.target.getAttribute("data-review-pur"));
    }
    // Acciones de administración (Editar / Quitar)
    if (e.target.hasAttribute("data-edit-admin")) {
      const p = state.products.find(x => x.id === parseInt(e.target.getAttribute("data-edit-admin")));
      if (p) {
        byId("productId").value = p.id;
        byId("productName").value = p.name;
        byId("productCategory").value = p.category;
        byId("productPrice").value = p.price;
        byId("productOldPrice").value = p.oldPrice || "";
        byId("productRating").value = p.rating;
        byId("productBadge").value = p.badge || "";
        byId("productDescription").value = p.description;
        byId("productImage").value = p.image;
        byId("productGallery").value = (p.gallery || []).join("\n");
      }
    }
    if (e.target.hasAttribute("data-delete-admin")) {
      const id = parseInt(e.target.getAttribute("data-delete-admin"));
      state.products = state.products.filter(x => x.id !== id);
      await saveProductsToCloud();
      initAdminList();
      renderProducts();
    }
  });

  // Atajos navegación rápida
  byId("accountShortcut").onclick = () => byId("accountArea").scrollIntoView({ behavior: "smooth" });
  byId("walletShortcut").onclick = () => byId("accountArea").scrollIntoView({ behavior: "smooth" });
  byId("cartShortcut").onclick = () => byId("orderPanel").scrollIntoView({ behavior: "smooth" });
  byId("shopNow").onclick = () => byId("productGrid").scrollIntoView({ behavior: "smooth" });

  // Modales comportamiento básico
  byId("openInfo").onclick = () => byId("infoModal").classList.add("open");
  byId("closeInfo").onclick = () => byId("infoModal").classList.remove("open");
  byId("acceptInfo").onclick = () => byId("infoModal").classList.remove("open");
  byId("closeProduct").onclick = () => byId("productModal").classList.remove("open");
  byId("ownerHotspot").onclick = () => byId("adminOverlay").classList.add("open");
  byId("closeAdmin").onclick = () => byId("adminOverlay").classList.remove("open");
  
  // Agregar al pedido desde modal de detalle
  byId("detailAdd").onclick = () => {
    if (state.detailProductId) {
      const prod = state.products.find(p => p.id === state.detailProductId);
      if (prod) {
        state.cart.push(prod);
        renderCart();
        showToast("Producto agregado al pedido");
      }
    }
  };

  // Buscador
  byId("searchForm").onsubmit = (e) => {
    e.preventDefault();
    state.query = byId("searchInput").value;
    renderProducts();
  };

  // Autenticación por Formulario manual
  byId("accountForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = byId("email").value.trim().toLowerCase();
    const publicName = byId("publicName").value.trim();
    if (!email || !publicName) return;

    state.currentEmail = email;
    let user = await loadUserFromCloud(email);
    if (!user) {
      user = { email, publicName, wallet: 0, purchases: [], reviews: [] };
    } else {
      user.publicName = publicName; // Actualiza el nombre por si cambió
    }
    state.users[email] = user;
    await saveUserToCloud(email, user);
    updateInterface();
    showToast(`¡Bienvenido, ${publicName}!`);
  };

  // Autenticación por POPUP de Google Real
  byId("googleButton").onclick = async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      const email = result.user.email.toLowerCase();
      const publicName = result.user.displayName || "Usuario Premium";

      state.currentEmail = email;
      let user = await loadUserFromCloud(email);
      if (!user) {
        user = { email, publicName, wallet: 0, purchases: [], reviews: [] };
      }
      state.users[email] = user;
      await saveUserToCloud(email, user);
      updateInterface();
      showToast(`Conectado como ${user.publicName}`);
    } catch (error) {
      console.error(error);
      showToast("Error al autenticar con Google");
    }
  };

  // Observador de estado de sesión de Firebase
  onAuthStateChanged(auth, async (fbUser) => {
    if (fbUser) {
      const email = fbUser.email.toLowerCase();
      state.currentEmail = email;
      if (!state.users[email]) {
        state.users[email] = await loadUserFromCloud(email);
      }
      updateInterface();
    }
  });

  // Finalizar Compra por WhatsApp e Inyectar compra en el historial
  byId("checkoutButton").onclick = async () => {
    const user = currentUser();
    if (!user) {
      ensureUser();
      return;
    }
    if (!state.cart.length) return;

    // Generar IDs de compras temporales
    const textLines = state.cart.map(p => {
      const pId = "PUR-" + Math.floor(Math.random() * 900000 + 100000);
      user.purchases.push({
        purchaseId: pId,
        productId: p.id,
        date: new Date().toLocaleDateString("es-MX")
      });
      return `- ${p.name} (${money.format(p.price)})`;
    });

    // Guardar cambios del usuario comprador en Firebase
    await saveUserToCloud(state.currentEmail, user);

    // Mandar mensaje a WhatsApp
    const totalText = byId("total").textContent;
    const msg = encodeURIComponent(`¡Hola! Me interesa concretar este pedido en persona:\n\nCliente: ${user.publicName}\nCorreo: ${user.email}\n\nProductos:\n${textLines.join("\n")}\n\nTotal: ${totalText}\n\nQuedo atento para coordinar la entrega.`);
    
    state.cart = []; // Limpiamos carrito
    updateInterface();
    window.open(`https://wa.me/${sellerPhone}?text=${msg}`, "_blank");
  };

  // Enviar Reseña y ganar dinero ($10 MXN)
  byId("detailReviewForm").onsubmit = async (e) => {
    e.preventDefault();
    const user = currentUser();
    if (!user || !state.detailProductId || !state.detailPurchaseId) return;

    const text = byId("detailReviewText").value.trim();
    // Simulamos almacenamiento de foto en Base64 por simplicidad (puedes adaptarlo a Firebase Storage después)
    const fileInput = byId("detailReviewPhoto");
    let photoBase64 = "";

    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      photoBase64 = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    // Guardar la reseña en el registro del usuario
    user.reviews.push({
      purchaseId: state.detailPurchaseId,
      productId: state.detailProductId,
      text: text,
      photo: photoBase64
    });

    user.wallet += 10; // Sumar recompensa al monedero premium
    await saveUserToCloud(state.currentEmail, user);
    
    byId("detailReviewText").value = "";
    fileInput.value = "";
    
    showToast("¡Reseña publicada! Ganaste $10 MXN");
    byId("productModal").classList.remove("open");
    updateInterface();
  };

  // Guardar / Editar Producto desde el Panel Privado
  byId("productForm").onsubmit = async (e) => {
    e.preventDefault();
    const idVal = byId("productId").value;
    const galleryText = byId("productGallery").value;
    
    const productData = {
      id: idVal ? parseInt(idVal) : Date.now(),
      name: byId("productName").value.trim(),
      category: byId("productCategory").value.trim(),
      price: parseInt(byId("productPrice").value),
      oldPrice: byId("productOldPrice").value ? parseInt(byId("productOldPrice").value) : null,
      rating: parseFloat(byId("productRating").value),
      badge: byId("productBadge").value.trim() || null,
      description: byId("productDescription").value.trim(),
      image: byId("productImage").value.trim(),
      gallery: galleryText.split("\n").map(x => x.trim()).filter(Boolean)
    };

    if (idVal) {
      // Editar
      state.products = state.products.map(x => x.id === productData.id ? productData : x);
    } else {
      // Crear nuevo
      state.products.push(productData);
    }

    await saveProductsToCloud();
    byId("productForm").reset();
    byId("productId").value = "";
    
    initAdminList();
    renderCategories();
    renderProducts();
  };

  byId("resetProductForm").onclick = () => {
    byId("productForm").reset();
    byId("productId").value = "";
  };

  // Carga Inicial del Catálogo Completo
  loadProductsFromCloud();
</script>
</body>
</html>
